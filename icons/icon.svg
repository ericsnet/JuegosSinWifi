<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1224" />
      <stop offset="100%" stop-color="#060812" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" stroke="#1a2444" stroke-width="8" />

  <!-- D-Pad and Buttons Arcade Controller Vector -->
  <g filter="url(#neonGlow)">
    <!-- Controller Base -->
    <path d="M 120 200 C 120 160, 392 160, 392 200 L 416 330 C 426 380, 340 400, 310 350 L 290 320 C 270 310, 242 310, 222 320 L 202 350 C 172 400, 86 380, 96 330 Z" fill="#141c38" stroke="url(#neonGrad)" stroke-width="12" stroke-linejoin="round" />

    <!-- D-Pad Left -->
    <path d="M 170 220 H 190 V 240 H 210 V 260 H 190 V 280 H 170 V 260 H 150 V 240 H 170 Z" fill="#00f0ff" />

    <!-- Action Buttons Right -->
    <circle cx="340" cy="230" r="14" fill="#ff007f" />
    <circle cx="310" cy="250" r="14" fill="#00ff88" />
    <circle cx="370" cy="250" r="14" fill="#ffd700" />
    <circle cx="340" cy="270" r="14" fill="#00f0ff" />

    <!-- Center Screen/Indicator -->
    <rect x="236" y="215" width="40" height="20" rx="4" fill="#00f0ff" opacity="0.8" />
  </g>
</svg>
